<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- steel: cool grey, lit from top-left -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c6c9"/>
      <stop offset="0.45" stop-color="#8a999e"/>
      <stop offset="1" stop-color="#4f5b61"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d8b90"/>
      <stop offset="1" stop-color="#3c464c"/>
    </linearGradient>
    <radialGradient id="helm" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#d3dde0"/>
      <stop offset="0.45" stop-color="#93a3a8"/>
      <stop offset="1" stop-color="#46525a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="0.5" stop-color="#d79c33"/>
      <stop offset="1" stop-color="#8f5a1c"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0393f"/>
      <stop offset="0.6" stop-color="#8e2230"/>
      <stop offset="1" stop-color="#5a1420"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4434a"/>
      <stop offset="1" stop-color="#6e1a25"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a37"/>
      <stop offset="1" stop-color="#4a2c1a"/>
    </linearGradient>
    <linearGradient id="shieldField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a3a2c"/>
      <stop offset="1" stop-color="#4b1d18"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f1f2"/>
      <stop offset="0.5" stop-color="#b3c2c6"/>
      <stop offset="1" stop-color="#6f7f85"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b777d"/>
      <stop offset="1" stop-color="#3b444a"/>
    </linearGradient>
  </defs>

  <g stroke="#161b1d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground shadow -->
    <ellipse cx="128" cy="232" rx="62" ry="10" fill="#000" opacity="0.35" stroke="none"/>

    <!-- boots -->
    <path d="M100 206 h22 v18 q0 6 -6 6 h-22 q-6 0 -5 -6 z" fill="url(#leather)"/>
    <path d="M136 206 h22 v18 q1 6 -5 6 h-21 q-5 0 -5 -6 z" fill="url(#leather)"/>

    <!-- legs (mail) -->
    <rect x="104" y="184" width="17" height="24" rx="3" fill="url(#mail)"/>
    <rect x="137" y="184" width="17" height="24" rx="3" fill="url(#mail)"/>

    <!-- torso plate -->
    <path d="M96 128 q32 -14 66 0 l-4 52 q-29 8 -58 0 z" fill="url(#steel)"/>

    <!-- tabard (red, ragged hem) -->
    <path d="M106 132 q22 -6 46 0 l4 70 l-8 -6 l-7 8 l-8 -7 l-7 8 l-7 -8 l-8 7 l-6 -8 z" fill="url(#red)"/>
    <!-- tabard shading fold -->
    <path d="M129 136 l-1 60" fill="none" stroke="#4a101a" stroke-width="2" opacity="0.7"/>

    <!-- belt + buckle -->
    <path d="M100 172 q29 7 58 0 l0 9 q-29 7 -58 0 z" fill="url(#leather)"/>
    <rect x="122" y="171" width="14" height="11" rx="2" fill="url(#steel)"/>
    <rect x="126" y="174" width="6" height="5" fill="#2a2f31" stroke="none"/>

    <!-- sword arm (viewer's left) -->
    <path d="M90 136 q-8 18 -6 36 l14 2 q0 -18 6 -32 z" fill="url(#steelDark)"/>
    <!-- gauntlet -->
    <ellipse cx="92" cy="178" rx="9" ry="8" fill="url(#steel)"/>

    <!-- sword: grip in fist, blade angled down-left -->
    <g transform="rotate(38 92 178)">
      <rect x="88" y="166" width="8" height="10" fill="url(#leather)"/>
      <circle cx="92" cy="164" r="4.5" fill="url(#gold)"/>
      <rect x="77" y="184" width="30" height="6" rx="2" fill="url(#gold)"/>
      <path d="M86 190 h12 v52 l-6 10 l-6 -10 z" fill="url(#blade)"/>
      <path d="M92 192 v54" fill="none" stroke="#7d8d92" stroke-width="1.5"/>
    </g>

    <!-- left pauldron (viewer's left, small) -->
    <path d="M86 132 q8 -16 26 -12 q4 10 -2 20 q-14 4 -24 -8 z" fill="url(#steel)"/>
    <path d="M88 134 q10 6 22 4" fill="none" stroke="url(#gold)" stroke-width="3"/>

    <!-- gorget (neck rings) -->
    <path d="M108 118 q21 -6 42 0 v9 q-21 6 -42 0 z" fill="url(#steelDark)"/>
    <path d="M110 122 q19 -5 38 0" fill="none" stroke="#2c3438" stroke-width="2"/>

    <!-- right pauldron (viewer's right, big, gold trimmed) -->
    <path d="M146 120 q24 -10 34 8 q4 14 -6 22 q-18 2 -30 -10 z" fill="url(#steel)"/>
    <path d="M150 128 q16 -8 26 2" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M148 140 q14 8 26 8" fill="none" stroke="url(#gold)" stroke-width="3.5"/>

    <!-- kite shield (viewer's right) -->
    <path d="M150 140 q22 -10 44 0 q2 34 -22 58 q-24 -24 -22 -58 z" fill="#5d6a70"/>
    <path d="M155 144 q17 -7 34 0 q1 28 -17 48 q-18 -20 -17 -48 z" fill="url(#shieldField)" stroke-width="2"/>
    <!-- gold crest: stylised rampant beast reduced to a bold glyph -->
    <path d="M168 154 q8 -4 10 4 q-4 2 -3 6 q6 2 4 10 q-4 -2 -7 0 q2 6 -3 10 q-1 -6 -5 -8 q3 -4 1 -8 q-4 -2 -2 -8 q2 2 5 -6 z"
          fill="url(#gold)" stroke="#5a3510" stroke-width="1.5"/>

    <!-- helmet crest / plume -->
    <path d="M114 60 q4 -18 18 -16 q4 -10 14 -4 q10 -4 12 8 q8 4 2 12 q-24 -4 -46 0 z" fill="url(#crest)"/>
    <path d="M124 50 q6 -4 10 2 M138 46 q6 -2 8 4" fill="none" stroke="#e76a6e" stroke-width="2" opacity="0.8"/>

    <!-- great helm -->
    <path d="M100 96 q-2 -38 30 -40 q32 2 30 40 q0 22 -12 26 h-36 q-12 -4 -12 -26 z" fill="url(#helm)"/>
    <!-- vertical ridge -->
    <path d="M130 58 v26" fill="none" stroke="#e8eff0" stroke-width="2" opacity="0.7"/>
    <!-- gold visor band -->
    <path d="M102 86 q28 -8 56 0 v12 q-28 -8 -56 0 z" fill="url(#gold)"/>
    <!-- eye slit -->
    <path d="M110 90 q20 -5 40 0 v4 q-20 -5 -40 0 z" fill="#0b0e10" stroke="none"/>
    <!-- breathing holes -->
    <g fill="#1d2326" stroke="none">
      <circle cx="122" cy="108" r="1.8"/><circle cx="128" cy="109" r="1.8"/><circle cx="134" cy="109" r="1.8"/><circle cx="140" cy="108" r="1.8"/>
      <circle cx="125" cy="113" r="1.8"/><circle cx="131" cy="114" r="1.8"/><circle cx="137" cy="113" r="1.8"/>
    </g>
    <!-- helm highlight -->
    <path d="M110 74 q4 -12 14 -14" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>
  </g>
</svg>
